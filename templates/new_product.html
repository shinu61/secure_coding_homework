{% extends "base.html" %}
{% block title %}새 상품 등록{% endblock %}
{% block content %}
<h2>상품 등록</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  제목 (1~100자): <input type="text" name="title" required maxlength="100"><br>
  설명 (1~1000자): <br>
  <textarea name="description" rows="4" maxlength="1000" required></textarea><br>
  가격 (원, 0~100,000,000): <input type="number" name="price" min="0" max="100000000" required><br>
  <button type="submit">등록하기</button>
</form>
{% endblock %}
