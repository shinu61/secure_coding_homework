{% extends "base.html" %}
{% block title %}대시보드{% endblock %}
{% block content %}
<h2>대시보드</h2>

<form method="get" action="{{ url_for('search') }}" class="row">
  <input type="text" name="q" placeholder="상품 검색..." value="{{ query }}">
  <button type="submit" style="width:auto;">검색</button>
</form>

<h3>등록된 상품</h3>
<ul>
  {% for product in products %}
    <li>
      <a href="{{ url_for('view_product', product_id=product.id) }}">{{ product.title }}</a>
      - 가격: {{ "{:,}".format(product.price) }}원
    </li>
  {% else %}
    <li><small class="muted">등록된 상품이 없습니다.</small></li>
  {% endfor %}
</ul>
<p><a href="{{ url_for('new_product') }}">+ 새 상품 등록</a></p>
{% endblock %}
