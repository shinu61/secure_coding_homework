{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<h2>회원가입</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  사용자명 (영문/숫자/밑줄 3~20자): <input type="text" name="username" required maxlength="20"><br>
  비밀번호 (8~64자): <input type="password" name="password" required maxlength="64"><br>
  <button type="submit">회원가입</button>
</form>
{% endblock %}
