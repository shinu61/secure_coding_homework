{% extends "base.html" %}
{% block title %}상품 수정{% endblock %}
{% block content %}
<h2>상품 수정</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  제목: <input type="text" name="title" value="{{ product.title }}" required maxlength="100"><br>
  설명: <br>
  <textarea name="description" rows="4" maxlength="1000" required>{{ product.description }}</textarea><br>
  가격 (원): <input type="number" name="price" value="{{ product.price }}" min="0" max="100000000" required><br>
  <button type="submit">저장</button>
</form>
<p><a href="{{ url_for('view_product', product_id=product.id) }}">← 취소하고 돌아가기</a></p>
{% endblock %}
